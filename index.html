
<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aviator Analyzer</title>

<style>
body {
  margin: 0;
  padding: 20px;
  background: #10151e;
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 500px;
  margin: auto;
}

h1 {
  color: #39d98a;
  text-align: center;
}

.card {
  background: #1c2633;
  padding: 18px;
  margin: 15px 0;
  border-radius: 12px;
}

input, button {
  width: 100%;
  padding: 13px;
  margin-top: 10px;
  border: none;
  border-radius: 8px;
  box-sizing: border-box;
}

button {
  background: #20b875;
  color: white;
  font-weight: bold;
}

.resultado {
  color: #39d98a;
  font-size: 24px;
  font-weight: bold;
}

li {
  padding: 8px;
  border-bottom: 1px solid #354252;
}
</style>
</head>

<body>
<div class="container">

<h1>AVIATOR ANALYZER</h1>
<p style="text-align:center">
Painel de análise estatística
</p>

<div class="card">
<h3>Registar um valor</h3>
<input id="valor" type="number" step="0.01"
placeholder="Exemplo: 2.50">

<button onclick="adicionar()">
ADICIONAR REGISTO
</button>
</div>

<div class="card">
<h3>Estatísticas históricas</h3>
<p>Total de registos: <span id="total">0</span></p>
<p>Média: <span class="resultado" id="media">0.00</span></p>
<p>Maior valor: <span id="maior">0.00</span></p>
<p>Menor valor: <span id="menor">0.00</span></p>
</div>

<div class="card">
<h3>Histórico de registos</h3>
<ul id="historico"></ul>
<button onclick="limpar()">LIMPAR HISTÓRICO</button>
</div>

<p style="text-align:center;color:#8995a5;font-size:12px">
Ferramenta de análise de dados históricos.
Não realiza previsões.
</p>

</div>

<script>
let valores = [];

function adicionar() {
  let campo = document.getElementById("valor");
  let numero = parseFloat(campo.value);

  if (!Number.isFinite(numero) || numero <= 0) {
    alert("Introduza um valor válido.");
    return;
  }

  valores.push(numero);
  campo.value = "";
  atualizar();
}

function atualizar() {
  let total = valores.length;

  document.getElementById("total").textContent = total;

  if (total === 0) {
    document.getElementById("media").textContent = "0.00";
    document.getElementById("maior").textContent = "0.00";
    document.getElementById("menor").textContent = "0.00";
  } else {
    let soma = valores.reduce((a,b) => a+b, 0);

    document.getElementById("media").textContent =
      (soma / total).toFixed(2);

    document.getElementById("maior").textContent =
      Math.max(...valores).toFixed(2);

    document.getElementById("menor").textContent =
      Math.min(...valores).toFixed(2);
  }

  document.getElementById("historico").innerHTML =
    valores.map((v,i) =>
      `<li>Registo ${i+1}: ${v.toFixed(2)}</li>`
    ).join("");
}

function limpar() {
  if (confirm("Apagar todos os registos?")) {
    valores = [];
    atualizar();
  }
}
</script>

</body>
  </html>
